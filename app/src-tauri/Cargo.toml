[package]
name = "yataverse"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
[lib]
name = "yataverse_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }
[dependencies]
tauri = { version = "=3.0.0-alpha.6", features = [] }
tauri-runtime-wry = "=3.0.0-alpha.6"
serde_json = "1"
aes-gcm = "=0.11.1"
base64 = "=0.23.1"
getrandom = "=0.4.3"
libc = "=0.2.191"
sha2 = "=0.11.1"
tempfile = "=3.23.0"
unicode-normalization = "=0.1.26"
zeroize = "=1.9.2"
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
[features]
custom-protocol = ["tauri/custom-protocol"]
